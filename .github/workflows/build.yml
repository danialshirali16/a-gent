name: Build A Gent

on:
  workflow_dispatch:
    inputs:
      include_paused_platforms:
        description: Run paused Windows and Android jobs
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:ui

  visual:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chrome
      - run: npm run test:visual
      - run: npm run test:a11y
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diff
          path: test-results/

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:runtime
      - run: npm run desktop:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: A-Gent-macos
          path: release/*

  desktop-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.include_paused_platforms == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:runtime
      - run: npm run desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: A-Gent-windows
          path: release/*

  android:
    if: github.event_name == 'workflow_dispatch' && inputs.include_paused_platforms == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: A-Gent-android
          path: release/*.apk
